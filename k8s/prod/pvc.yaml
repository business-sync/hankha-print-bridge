# The bridge's identity, and the only stateful thing about this deployment.
#
# `<PRINT_BRIDGE_STATE_DIR>/relay.json` holds `install_id`, `bridge_id` and the relay token —
# the credential minted once at enrolment and never shown again. Without a volume it is written
# to the container filesystem and destroyed on every restart, which un-pairs the bridge in a way
# that no amount of waiting recovers: the relay loop needs a token it no longer has.
#
# The spool directory lives here too, so a pod that restarts mid-print still knows which jobs
# were in flight and can settle them honestly as `unknown` rather than silently reprinting.
#
# ReadWriteOnce is correct and load-bearing: a relay identity is single-holder by construction —
# two pods sharing one `bridge_id` would both claim from the same queue and race for the same
# jobs. It is also why `deployment.yaml` uses the `Recreate` strategy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hankha-print-bridge-state
  namespace: hankha
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Kilobytes of real data. The floor is the cluster's minimum allocation, not a need.
      storage: 1Gi
  # storageClassName omitted on purpose — the cluster default applies. Pin it here if this
  # cluster has more than one and the default is not the one you want.
