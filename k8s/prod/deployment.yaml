apiVersion: apps/v1
kind: Deployment
metadata:
  name: hankha-print-bridge
  namespace: hankha
  labels:
    app: hankha-print-bridge
spec:
  selector:
    matchLabels:
      app: hankha-print-bridge
  replicas: 1
  # Recreate, not RollingUpdate. Two things forbid an overlap: the relay identity in `relay.json`
  # is single-holder by construction (two pods sharing one `bridge_id` would race each other for
  # the same claimed jobs), and the PVC below is ReadWriteOnce. `maxSurge: 25%` rounds UP to 1
  # on a single replica, so the old strategy started the replacement BEFORE the old pod exited —
  # which on a multi-node cluster deadlocks on the volume.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hankha-print-bridge
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: hankha-print-bridge
        image: ghcr.io/business-sync/hankha-print-bridge:b095b8e1400b94186c29d499bf5c4cc540ed492f
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            memory: 100Mi
          limits:
            cpu: 2000m
            memory: 2048Mi
        # httpGet, not tcpSocket: the kernel completes a TCP handshake from the accept backlog
        # even when the event loop is wedged, so the old probe could never detect the one failure
        # a restart would fix. `/health` is deliberately unauthenticated, so this keeps working
        # once PRINT_BRIDGE_TOKEN is set.
        livenessProbe:
          httpGet:
            path: /health
            port: 9200
          initialDelaySeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9200
          initialDelaySeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: hankha-print-bridge-config
        # Carries PRINT_BRIDGE_TOKEN. Required, not optional: an empty token makes
        # `isAuthorized()` true for everyone, and this pod is on NodePort 30021. A missing
        # Secret holds the pod in CreateContainerConfigError, which is the correct failure —
        # far better than a bridge that starts and accepts print jobs from anyone.
        # See the comment in config.yaml for the command that creates it.
        - secretRef:
            name: hankha-print-bridge-secret
        ports:
        - containerPort: 9200
          name: http
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime
        # Must match PRINT_BRIDGE_STATE_DIR in config.yaml.
        - name: state
          mountPath: /var/lib/hankha-print-bridge

      volumes:
      - name: localtime
        hostPath:
          path: /usr/share/zoneinfo/Asia/Bangkok
      - name: state
        persistentVolumeClaim:
          claimName: hankha-print-bridge-state
      restartPolicy: Always
