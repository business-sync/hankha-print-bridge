apiVersion: apps/v1
kind: Deployment
metadata:
  name: hankha-print-bridge
  namespace: hankha
  labels:
    app: hankha-print-bridge
spec:
  selector:
    matchLabels:
      app: hankha-print-bridge
  replicas: 1
  # Recreate, not RollingUpdate, and it is now the ONLY thing keeping this single-holder.
  # The relay identity in `relay.json` cannot be shared: two pods on one `bridge_id` would both
  # claim from the same queue and race for the same jobs. This used to be enforced twice over,
  # because the state volume was a ReadWriteOnce PVC — but that PVC could never bind on this
  # cluster (see the volume below), so the storage layer no longer refuses a second attacher.
  # `replicas: 1` + `Recreate` is the whole guarantee. Do not raise the replica count, and do
  # not switch to RollingUpdate: `maxSurge: 25%` rounds UP to 1 on a single replica, which
  # starts the replacement BEFORE the old pod exits.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hankha-print-bridge
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: hankha-print-bridge
        image: ghcr.io/business-sync/hankha-print-bridge:91fd1ced183152de4f6ae680900d593af41880b8
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            memory: 100Mi
          limits:
            cpu: 2000m
            memory: 2048Mi
        # httpGet, not tcpSocket: the kernel completes a TCP handshake from the accept backlog
        # even when the event loop is wedged, so the old probe could never detect the one failure
        # a restart would fix. `/health` is deliberately unauthenticated, so this keeps working
        # once PRINT_BRIDGE_TOKEN is set.
        livenessProbe:
          httpGet:
            path: /health
            port: 9200
          initialDelaySeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9200
          initialDelaySeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: hankha-print-bridge-config
        # Carries PRINT_BRIDGE_TOKEN. Required, not optional: an empty token makes
        # `isAuthorized()` true for everyone, and this pod is on NodePort 30021. A missing
        # Secret holds the pod in CreateContainerConfigError, which is the correct failure —
        # far better than a bridge that starts and accepts print jobs from anyone.
        # See the comment in config.yaml for the command that creates it.
        - secretRef:
            name: hankha-print-bridge-secret
        ports:
        - containerPort: 9200
          name: http
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime
        # Must match PRINT_BRIDGE_STATE_DIR in config.yaml.
        - name: state
          mountPath: /var/lib/hankha-print-bridge
          # Own subdirectory on the shared export, exactly as hankha-backend does for
          # /app/uploads. The export root is shared with every other app that mounts it.
          subPath: hankha-print-bridge/state

      volumes:
      - name: localtime
        hostPath:
          path: /usr/share/zoneinfo/Asia/Bangkok
      # The cluster's real storage: an NFS export on gfs-01, mounted directly. This was a
      # ReadWriteOnce PVC with `storageClassName` omitted "so the cluster default applies" —
      # but this cluster has NO StorageClasses and NO PersistentVolumes at all, so there is no
      # default and nothing to provision from. The claim sat Pending on
      # `FailedBinding: no persistent volumes available … and no storage class is set`, the pod
      # sat Unschedulable on `unbound immediate PersistentVolumeClaims`, and because `Recreate`
      # deletes the old pod FIRST, the bridge was down outright for ~2.3 days across nine
      # consecutive revisions rather than merely failing to update.
      #
      # Direct NFS is what every mounted volume in this namespace uses (hankha-backend's
      # /app/uploads is the live example). Trade-off taken knowingly: NFS is RWX, so the storage
      # layer no longer enforces single-holder — see the `strategy` comment above, which now
      # carries that guarantee alone.
      - name: state
        nfs:
          path: /gv0
          server: gfs-01
      restartPolicy: Always
