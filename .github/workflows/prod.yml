name: Prod environment CI and CD

on:
  push:
    branches: ["main"]

jobs:
  # ==============
  # CI task
  # ==============
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup SHA
        run: echo "GITHUB_SHA=${GITHUB_SHA}" >> $GITHUB_ENV
      - name: Login ghcr.io
        uses: docker/login-action@v2.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.WORKFLOW_TOKEN }}
          logout: true
      - name: Pull the latest Docker image
        run: docker pull ghcr.io/business-sync/hankha-print-bridge:latest || true
      - name: Build the Docker image
        run: docker build . --file ./docker/Dockerfile --tag ghcr.io/business-sync/hankha-print-bridge:${{ env.GITHUB_SHA }} --tag ghcr.io/business-sync/hankha-print-bridge:latest
      - name: Push the Docker image
        run: docker push ghcr.io/business-sync/hankha-print-bridge:${{ env.GITHUB_SHA }}
      - name: Push the Docker image latest
        run: docker push ghcr.io/business-sync/hankha-print-bridge:latest

  # ==============
  # CD PORD task
  # ==============
  gitops-prod-versioning:
    runs-on: ubuntu-latest
    needs: [build-and-push-docker-image]
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: config git
        run: |
          git --version
          git config user.name "robot"
          git config user.email "root@hankh.com"
      # The bump is rebuilt on the current tip of main, never rebased onto it. The checkout is this
      # run's push SHA, and when two pushes land close together the other run's bump commit is
      # already on main by the time this job runs. Both bumps rewrite the same `image:` line, so
      # `git pull --rebase` conflicts every time. Resetting to origin/main and re-applying the sed
      # can't conflict, and a rejected push (main moved again) just goes round the loop.
      - name: change image tag to deploy prod
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            sed "s|image: ghcr\.io/business-sync/hankha-print-bridge:[^ ]*|image: ghcr.io/business-sync/hankha-print-bridge:${GITHUB_SHA}|" k8s/prod/deployment.yaml > tmp_deployment.yaml
            mv tmp_deployment.yaml k8s/prod/deployment.yaml
            git add k8s/prod/deployment.yaml
            if git diff --cached --quiet; then
              echo "prod manifest already at ${GITHUB_SHA}"
              exit 0
            fi
            git commit -m "[skip actions] 🤖 change prod docker image version to ${GITHUB_SHA}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected on attempt ${attempt} (main moved), retrying"
            sleep $((attempt * 5))
          done
          echo "could not push the prod image bump after 5 attempts"
          exit 1
